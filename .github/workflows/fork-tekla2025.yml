name: Fork build Tekla 2025

on:
  push:
    branches: [ main, jokubas ]
    paths-ignore: [ "library/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (Tekla 2025)
        shell: pwsh
        run: dotnet build TeklaMcp.sln -c Release -p:TeklaVersion=2025.0.0 -p:Version=0.9.0-jokubas
      - name: Unit tests
        run: dotnet test tests/TeklaMcp.Tests -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: TeklaMcp.Server-tekla2025
          path: src/TeklaMcp.Server/bin/Release/net48/
          if-no-files-found: error
      - name: Publish build to dist branch
        shell: bash
        run: |
          set -x
          cp -r src/TeklaMcp.Server/bin/Release/net48 "$RUNNER_TEMP/dist"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan dist-tekla2025
          git rm -rfq .
          git clean -fdxq
          cp -r "$RUNNER_TEMP/dist/." .
          git add -A -f
          git commit -qm "Build of $GITHUB_SHA"
          git push -f origin dist-tekla2025
